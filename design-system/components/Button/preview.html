<!doctype html>
<html>
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Button — preview</title></head>
<body>
<div class="cr-stack cr-pad">
  <div class="cr-row">
    <a class="cr-btn cr-btn-hot" href="#">Agendar avaliação <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 11.5l7-7M5.5 4.5h6v6"/></svg></a>
    <a class="cr-btn cr-btn-dark" href="#">Ver tratamentos <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 11.5l7-7M5.5 4.5h6v6"/></svg></a>
    <a class="cr-btn cr-btn-dark cr-btn-sm" href="#">Conhecer a Clube do Corpo <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 11.5l7-7M5.5 4.5h6v6"/></svg></a>
    <a class="cr-line-link" href="#">Como chegar <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 11.5l7-7M5.5 4.5h6v6"/></svg></a>
    <button class="cr-btn cr-btn-dark cr-btn-sm" disabled>Vagas esgotadas</button>
    <button class="cr-circle-btn" aria-label="Anterior"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5L5.5 8l4.5 4.5"/></svg></button>
    <button class="cr-circle-btn" aria-label="Próximo"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5L10.5 8 6 12.5"/></svg></button>
  </div>
  <div class="cr-row cr-photo" style="padding:var(--space-6);border-radius:var(--radius-frame);color:var(--on-grafite)">
    <a class="cr-btn cr-btn-pastel" href="#">Quero minha consulta online <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 11.5l7-7M5.5 4.5h6v6"/></svg></a>
    <a class="cr-btn cr-btn-pastel cr-btn-sm" href="#">Agendar</a>
    <a class="cr-line-link is-accent" href="#">Ver resultados <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 11.5l7-7M5.5 4.5h6v6"/></svg></a>
  </div>
</div>
</body>
</html>
